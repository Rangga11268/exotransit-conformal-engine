<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark deep-space gradient background -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Host Star Radial Luminescence -->
    <radialGradient id="starGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <!-- Conformal Confidence Envelope Fill (1 - alpha) -->
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#spaceBg)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Coordinate Reference Grids -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <circle cx="256" cy="256" r="190" fill="none" />
  </g>

  <!-- Conformal Error Guarantee Band (Mathematical 1 - alpha Boundary) -->
  <path d="M 64 256 C 140 256, 180 270, 210 330 C 230 370, 282 370, 302 330 C 332 270, 372 256, 448 256 L 448 274 C 372 274, 336 290, 306 350 C 282 396, 230 396, 206 350 C 176 290, 140 274, 64 274 Z" 
        fill="url(#envelopeGrad)" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" opacity="0.85" />

  <!-- Host Stellar Disk (Parent Star) -->
  <circle cx="256" cy="256" r="130" fill="url(#starGlow)" />

  <!-- Equatorial Transit Chord Track -->
  <line x1="126" y1="256" x2="386" y2="256" stroke="#0b0f19" stroke-width="3" opacity="0.4" stroke-dasharray="3 5" />

  <!-- Transiting Exoplanet Silhouette (Occulting Ingress / Transit Phase) -->
  <circle cx="310" cy="256" r="38" fill="#070a13" stroke="#38bdf8" stroke-width="3.5" />

  <!-- Mathematical Photometric Ingress Vector -->
  <path d="M 64 256 C 150 256, 185 258, 210 334 C 230 380, 282 380, 302 334 C 327 258, 362 256, 448 256" 
        fill="none" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" />

  <!-- Minimum Ingress Center Marker -->
  <circle cx="256" cy="368" r="5" fill="#38bdf8" />
  <circle cx="256" cy="368" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- Precision Vernier Scale Accent Dots -->
  <circle cx="64" cy="256" r="4" fill="#38bdf8" />
  <circle cx="448" cy="256" r="4" fill="#38bdf8" />
</svg>
