name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: "."
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -c "
          import subprocess, sys
          p = subprocess.run([sys.executable, 'run_tests.py'], capture_output=True, text=True)
          print(p.stdout)
          if p.stderr:
              print('STDERR:\n', p.stderr)
          sys.exit(p.returncode)
          "

      - name: Run interactive terminal demo
        run: |
          python demo.py

      - name: Run conformal coverage & SNR ablation benchmark
        run: |
          python benchmarks/benchmark_conformal.py

      - name: Run CPU inference latency benchmark
        run: |
          python benchmarks/benchmark_latency.py
