name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: "."
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          python run_tests.py

      - name: Run interactive terminal demo
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          python demo.py

      - name: Run conformal coverage & SNR ablation benchmark
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          python benchmarks/benchmark_conformal.py

      - name: Run CPU inference latency benchmark
        env:
          PYTHONPATH: .
          CI: "true"
        run: |
          python benchmarks/benchmark_latency.py
